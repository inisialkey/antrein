name: antrein
description: "AntreIn — booking, payment, check-in and real-time queue for barbershops."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management — Cubit-first (flutter-brief §6).
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  # DI — get_it + injectable codegen.
  get_it: ^9.2.1
  injectable: ^3.0.0
  # Functional result type — Either<Failure, T> (no dartz).
  fpdart: ^1.2.0
  # Models — freezed + json.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # Networking.
  dio: ^5.9.2
  # Realtime — Socket.IO client for the /realtime queue feed (M9).
  socket_io_client: ^2.0.3+1
  # Secure token storage.
  flutter_secure_storage: ^9.2.4
  # Navigation — named routes only.
  go_router: ^17.3.0
  equatable: ^2.0.8
  flutter_localizations:
    sdk: flutter
  # Logging facade backend.
  logger: ^2.7.0
  # Responsive scaling (Dimens .r / .sp).
  flutter_screenutil: ^5.9.3
  # Image loading + cache.
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  # Typography — Figtree (display) + Noto Sans (body), the ui-ux-pro-max pairing.
  # ponytail: runtime-fetched + cached; bundle the TTFs for offline in hardening.
  google_fonts: ^6.2.1
  # Native splash held through async bootstrap; preserve()/remove() at runtime.
  flutter_native_splash: ^2.4.0

  onesignal_flutter: ^5.3.0
  # Opens the provider-hosted checkout page in the system browser (§72).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.6-dev.1
  injectable_generator: ^3.0.2
  json_serializable: ^6.14.0
  very_good_analysis: ^10.3.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  alchemist: ^0.14.0

flutter:
  uses-material-design: true
  # Generate AppLocalizations from lib/l10n/arb (see l10n.yaml).
  generate: true
