name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/api-contracts/**"
      - "infrastructure/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/api-contracts/**"
      - "infrastructure/**"
      - ".github/workflows/api-ci.yml"

jobs:
  scaffold-check:
    # Repo is pre-implementation; skip CI cleanly until apps/api is scaffolded.
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/api/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: scaffold-check
    if: needs.scaffold-check.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: antrein
          POSTGRES_PASSWORD: antrein
          POSTGRES_DB: antrein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antrein"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://antrein:antrein@localhost:5432/antrein_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node version is an open decision (see CLAUDE.md); pin via ADR.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Generate OpenAPI
        run: npm run openapi:generate
