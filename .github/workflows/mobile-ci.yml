name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"
      - "packages/api-contracts/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/api-contracts/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  scaffold-check:
    # Skips CI cleanly until apps/mobile is scaffolded (now present since M3).
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: scaffold-check
    if: needs.scaffold-check.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned per ADR 0042.
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Layer boundaries (domain stays pure Dart)
        # Fallback for the deferred import_lint plugin (ADR 0042): the domain
        # layer must not import Flutter, Dio, or a feature's data/presentation.
        run: |
          bad=$(grep -rElP "import 'package:(flutter|dio)/|package:antrein/features/[a-z_]+/(data|presentation)/" lib/features --include='*.dart' | grep '/domain/' || true)
          if [ -n "$bad" ]; then
            echo "::error::domain layer imports a forbidden dependency:"; echo "$bad"; exit 1
          fi

      - name: Tests
        run: flutter test
